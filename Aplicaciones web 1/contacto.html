<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto - CinePlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container py-3">
      <a class="navbar-brand" href="index.html">🎥 CinePlus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="renta.html">Rentar</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="text-center mb-4">
          <h2 class="fw-bold">Contacto</h2>
          <p class="text-muted">Comunícate con el equipo de CinePlus</p>
        </div>
        
        <div class="card p-4 shadow-sm">
          <div id="form-errores" class="alert alert-danger" style="display: none;"></div>
          <form id="form-contacto">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu nombre">
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" id="correo" class="form-control" placeholder="Ingresa tu correo">
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje (20-50 caracteres)</label>
              <textarea id="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center mt-auto">
    <div class="container">
      <p class="mb-0">CinePlus - La mejor experiencia cinematográfica</p>
      <small>© 2026 CinePlus.</small>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
