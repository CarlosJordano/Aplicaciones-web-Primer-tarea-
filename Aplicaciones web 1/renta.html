<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rentar Película - CinePlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container py-3">
      <a class="navbar-brand" href="index.html">🎥 CinePlus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="renta.html">Rentar</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="text-center mb-4 fw-bold">Rentar Películas</h2>
        <div class="card p-4 shadow-sm">
          <form id="form-renta">
            <div class="mb-3">
              <label class="form-label">Nombre del Cliente</label>
              <input type="text" id="clienteNombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Selecciona Película(s) (Usa Ctrl/Cmd para elegir varias)</label>
              <select id="peliculaRenta" class="form-select" multiple required style="height: 150px;">
                </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Días de renta</label>
                <input type="number" id="diasRenta" class="form-control" min="1" max="30" value="1" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Forma de Pago</label>
                <select id="metodoPago" class="form-select" required>
                  <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                  <option value="PayPal">PayPal</option>
                  <option value="Efectivo">Efectivo (En tienda)</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Confirmar Renta</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalRecibo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">¡Compra Exitosa!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p><strong>Cliente:</strong> <span id="resCliente"></span></p>
          <p><strong>Película(s):</strong> <span id="resPeliculas"></span></p>
          <p><strong>Días rentados:</strong> <span id="resDias"></span></p>
          <p><strong>Método de pago:</strong> <span id="resMetodo"></span></p>
          <hr>
          <h4 class="text-end">Total a Pagar: <span id="resTotal" class="text-primary fw-bold"></span></h4>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-auto">
    <div class="container">
      <p class="mb-0">CinePlus - La mejor experiencia cinematográfica</p>
      <small>© 2026 CinePlus.</small>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
